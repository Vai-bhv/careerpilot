[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-local"
version = "0.1.0"
description = "Local evidence-based job discovery and application workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2,<2", "pypdf>=6,<8", "httpx>=0.28,<1",
  "streamlit>=1.45,<2", "mcp>=1.12,<2", "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
careerpilot = "app.cli:main"
careerpilot-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["private"]
line-length = 100
target-version = "py312"
